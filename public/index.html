<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile.bg Dealer Control</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f7fa; color: #212121; }
        header { background: #1a73e8; color: white; padding: 16px 24px; }
        main { padding: 24px; max-width: 960px; margin: 0 auto; }
        textarea { width: 100%; min-height: 240px; font-family: monospace; margin-bottom: 12px; }
        button { background: #1a73e8; border: none; color: white; padding: 12px 18px; cursor: pointer; border-radius: 4px; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .section { margin-bottom: 24px; }
        .status { padding: 12px 16px; border-radius: 8px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        .status pre { white-space: pre-wrap; word-break: break-word; margin: 0; }
    </style>
</head>
<body>
    <header>
        <h1>Mobile.bg Dealer Control</h1>
        <p>Use the UI to run scraping or send-mode locally and inspect success state.</p>
    </header>
    <main>
        <div class="section status">
            <strong>Instructions:</strong>
            <ol>
                <li>Update input JSON below.</li>
                <li>Click Run.</li>
                <li>View response and output JSON link.</li>
            </ol>
        </div>

        <div class="section">
            <label for="inputJson"><strong>Input JSON</strong></label>
            <textarea id="inputJson"></textarea>
        </div>

        <div class="section">
            <button id="loadSample">Load Sample</button>
            <button id="runButton">Run</button>
        </div>

        <div class="section status">
            <h2>Result</h2>
            <div id="resultSummary">No result yet.</div>
            <div id="resultActions" style="margin:12px 0; display:flex; flex-wrap:wrap; gap:8px;"></div>
            <div id="resultList"></div>
            <div id="rawJsonContainer" style="display:none; margin-top:16px;">
                <strong>Raw result</strong>
                <pre id="rawJsonArea" style="background:#f0f4ff; padding:12px; border-radius:8px; max-height:320px; overflow:auto;"></pre>
            </div>
        </div>
    </main>
    <script>
        const inputEl = document.getElementById('inputJson');
        const loadSampleButton = document.getElementById('loadSample');
        const runButton = document.getElementById('runButton');
        const resultSummary = document.getElementById('resultSummary');
        const resultList = document.getElementById('resultList');
        const rawJsonContainer = document.getElementById('rawJsonContainer');
        const rawJsonArea = document.getElementById('rawJsonArea');

        function setStatus(text, isError = false) {
            resultSummary.textContent = text;
            resultSummary.style.color = isError ? '#c00' : '#111';
            resultList.innerHTML = '';
            rawJsonContainer.style.display = 'none';
        }

        function renderDealerTable(dealers) {
            if (!Array.isArray(dealers) || dealers.length === 0) {
                resultList.innerHTML = '<p>No dealer results available.</p>';
                return;
            }
            const table = document.createElement('table');
            table.style.width = '100%';
            table.style.borderCollapse = 'collapse';
            table.innerHTML = `
                <thead>
                    <tr>
                        <th style="text-align:left; padding:8px; border-bottom:2px solid #ddd;">Dealer URL</th>
                        <th style="text-align:left; padding:8px; border-bottom:2px solid #ddd;">Submitted</th>
                        <th style="text-align:left; padding:8px; border-bottom:2px solid #ddd;">Success</th>
                        <th style="text-align:left; padding:8px; border-bottom:2px solid #ddd;">Error</th>
                        <th style="text-align:left; padding:8px; border-bottom:2px solid #ddd;">Reason</th>
                    </tr>
                </thead>
                <tbody></tbody>
            `;
            const tbody = table.querySelector('tbody');
            dealers.forEach((dealer) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td style="padding:8px; border-bottom:1px solid #eee;">${dealer.dealerUrl || dealer.contactsUrl || '—'}</td>
                    <td style="padding:8px; border-bottom:1px solid #eee;">${dealer.contactForm?.submitted ?? '—'}</td>
                    <td style="padding:8px; border-bottom:1px solid #eee;">${dealer.contactForm?.success ?? '—'}</td>
                    <td style="padding:8px; border-bottom:1px solid #eee;">${dealer.contactForm?.error ?? '—'}</td>
                    <td style="padding:8px; border-bottom:1px solid #eee;">${dealer.contactForm?.reason || '—'}</td>
                `;
                tbody.appendChild(row);
            });
            resultList.innerHTML = '';
            resultList.appendChild(table);
        }

        async function loadSample() {
            const res = await fetch('/api/sample-input');
            const data = await res.json();
            inputEl.value = JSON.stringify(data, null, 2);
            setStatus('Loaded sample input.');
        }

        async function runTask() {
            runButton.disabled = true;
            setStatus('Running...');
            resultList.innerHTML = '';
            rawJsonContainer.style.display = 'none';
            document.getElementById('resultActions').innerHTML = '';
            try {
                const input = JSON.parse(inputEl.value || '{}');
                const res = await fetch('/api/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(input),
                });
                const data = await res.json();
                if (data.status !== 'ok') {
                    setStatus(`Error: ${data.message || 'Unknown error'}`, true);
                    rawJsonArea.textContent = JSON.stringify(data, null, 2);
                    rawJsonContainer.style.display = 'block';
                    return;
                }
                const result = data.result;
                rawJsonArea.textContent = JSON.stringify(result, null, 2);
                const summaryText = Array.isArray(result)
                    ? `Finished: ${result.length} dealer result(s).`
                    : 'Finished: result returned.';
                setStatus(summaryText);
                if (Array.isArray(result)) {
                    renderDealerTable(result);
                } else {
                    resultList.innerHTML = `<pre style="white-space:pre-wrap; word-break:break-word; background:#f0f4ff; padding:12px; border-radius:8px;">${JSON.stringify(result, null, 2)}</pre>`;
                }
                const toggleButton = document.createElement('button');
                toggleButton.textContent = 'Show raw JSON';
                toggleButton.type = 'button';
                toggleButton.addEventListener('click', () => {
                    const isVisible = rawJsonContainer.style.display === 'block';
                    rawJsonContainer.style.display = isVisible ? 'none' : 'block';
                    toggleButton.textContent = isVisible ? 'Show raw JSON' : 'Hide raw JSON';
                });
                document.getElementById('resultActions').appendChild(toggleButton);
            } catch (err) {
                setStatus(`Error: ${err.message}`, true);
                rawJsonArea.textContent = err.stack || err.message;
                rawJsonContainer.style.display = 'block';
            } finally {
                runButton.disabled = false;
            }
        }

        loadSampleButton.addEventListener('click', loadSample);
        runButton.addEventListener('click', runTask);
        loadSample();
    </script>
</body>
</html>
